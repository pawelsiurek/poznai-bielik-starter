<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodaj Fiszkę</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #21262d;
      --border: #30363d;
      --accent: #58a6ff;
      --success: #3fb950;
      --danger: #f85149;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-subtle: #484f58;
      --radius: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.5rem 1rem 3rem;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 0.35rem;
    }

    input, textarea, select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.55rem 0.875rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 0.75rem;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 70px; }
    select option { background: var(--surface-2); }

    .field { margin-bottom: 0.1rem; }

    .btn {
      width: 100%;
      padding: 0.65rem 1rem;
      border: none;
      border-radius: var(--radius);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.25rem;
    }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #79b8ff; }
    .btn-ai { background: #238636; color: #fff; }
    .btn-ai:hover { background: #2ea043; }
    .btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading-msg {
      display: none;
      text-align: center;
      font-size: 0.82rem;
      color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .status-msg {
      text-align: center;
      font-size: 0.82rem;
      min-height: 1.2rem;
      margin-top: 0.5rem;
      transition: color 0.2s;
    }
    .status-msg.ok  { color: var(--success); }
    .status-msg.err { color: var(--danger); }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 0.75rem 0;
    }

    #new-deck-input {
      display: none;
      margin-top: -0.5rem;
    }
  </style>
</head>
<body>

  <h1>Dodaj Fiszkę</h1>

  <!-- Imię + talia — wspólne dla obu sekcji -->
  <div class="card">
    <div class="card-title">Ustawienia</div>
    <div class="field">
      <label for="nazwaUcznia">Twoje imię (opcjonalnie)</label>
      <input type="text" id="nazwaUcznia" placeholder="Anonim">
    </div>
    <div class="field">
      <label for="talia-select">Talia</label>
      <select id="talia-select">
        <option value="Ogólne">Ogólne</option>
        <option value="__new__">+ Nowa talia...</option>
      </select>
      <input type="text" id="new-deck-input" placeholder="Nazwa nowej talii...">
    </div>
  </div>

  <!-- Ręczna fiszka -->
  <div class="card">
    <div class="card-title">Dodaj ręcznie</div>
    <div class="field">
      <label for="przod">Przód (pytanie)</label>
      <textarea id="przod" placeholder="Co to jest...?" rows="2"></textarea>
    </div>
    <div class="field">
      <label for="tyl">Tył (odpowiedź)</label>
      <textarea id="tyl" placeholder="To jest..." rows="2"></textarea>
    </div>
    <button class="btn btn-primary" onclick="wyslijFiszke()">Wyślij fiszkę</button>
    <div class="status-msg" id="status-manual"></div>
  </div>

  <!-- Wklej notatki → AI -->
  <div class="card">
    <div class="card-title">Wklej notatki (AI)</div>
    <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:0.75rem">
      Wklej tekst notatek — Bielik wygeneruje fiszki dla całej klasy.
    </p>
    <div class="field">
      <label for="notatkiInput">Tekst / notatki</label>
      <textarea id="notatkiInput" placeholder="Wklej tutaj tekst ze schowka..." rows="6"></textarea>
    </div>
    <button class="btn btn-ai" onclick="wyslijNotatki()">Generuj fiszki z tekstu (AI)</button>
    <div class="status-msg" id="status-notatki"></div>
  </div>

  <!-- Upload AI -->
  <div class="card">
    <div class="card-title">Wygeneruj z pliku (AI)</div>
    <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:0.75rem">
      Bielik przeanalizuje plik i wygeneruje fiszki dla całej klasy.
    </p>
    <div class="field">
      <label for="fileInput">Plik (.txt lub .pdf)</label>
      <input type="file" id="fileInput" accept=".txt,.pdf">
    </div>
    <div class="loading-msg" id="loadingMsg">Bielik analizuje... proszę czekać</div>
    <button class="btn btn-ai" id="btnUpload" onclick="wyslijPlik()">Przeanalizuj plik (AI)</button>
    <div class="status-msg" id="status-upload"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    // Załaduj dostępne talie
    async function loadDecks() {
      try {
        const res = await fetch('/api/decks');
        const decks = await res.json();
        const sel = document.getElementById('talia-select');
        sel.innerHTML = decks.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('') +
          '<option value="__new__">+ Nowa talia...</option>';
      } catch { /* użyj domyślnych */ }
    }

    document.getElementById('talia-select').addEventListener('change', function() {
      const inp = document.getElementById('new-deck-input');
      inp.style.display = this.value === '__new__' ? 'block' : 'none';
      if (this.value === '__new__') inp.focus();
    });

    function getTalia() {
      const sel = document.getElementById('talia-select');
      if (sel.value === '__new__') {
        return document.getElementById('new-deck-input').value.trim() || 'Ogólne';
      }
      return sel.value || 'Ogólne';
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function setStatus(id, msg, type) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = `status-msg ${type}`;
      if (type === 'ok') setTimeout(() => { el.textContent = ''; el.className = 'status-msg'; }, 3000);
    }

    function wyslijFiszke() {
      const nazwa = document.getElementById('nazwaUcznia').value || 'Anonim';
      const przod  = document.getElementById('przod').value.trim();
      const tyl    = document.getElementById('tyl').value.trim();
      const talia  = getTalia();

      if (!przod || !tyl) { setStatus('status-manual', 'Wypełnij pytanie i odpowiedź.', 'err'); return; }

      socket.emit('submit_flashcard', { nazwaUcznia: nazwa, przod, tyl, talia });

      document.getElementById('przod').value = '';
      document.getElementById('tyl').value = '';
      setStatus('status-manual', 'Fiszka wysłana!', 'ok');
    }

    async function wyslijPlik() {
      const fileInput = document.getElementById('fileInput');
      const nazwa = document.getElementById('nazwaUcznia').value || 'Anonim';
      const talia  = getTalia();
      const btn    = document.getElementById('btnUpload');
      const loader = document.getElementById('loadingMsg');

      if (!fileInput.files.length) { setStatus('status-upload', 'Wybierz plik.', 'err'); return; }

      const fd = new FormData();
      fd.append('plik', fileInput.files[0]);
      fd.append('talia', talia);
      fd.append('studentName', nazwa);

      btn.disabled = true;
      loader.style.display = 'block';
      setStatus('status-upload', '', '');

      try {
        const res    = await fetch('/api/upload', { method: 'POST', body: fd });
        const result = await res.json();
        if (res.ok) {
          fileInput.value = '';
          setStatus('status-upload', `Wygenerowano ${result.count} fiszek!`, 'ok');
        } else {
          setStatus('status-upload', result.error || 'Błąd serwera.', 'err');
        }
      } catch {
        setStatus('status-upload', 'Błąd połączenia z serwerem.', 'err');
      } finally {
        btn.disabled = false;
        loader.style.display = 'none';
      }
    }

    async function wyslijNotatki() {
      const text  = document.getElementById('notatkiInput').value.trim();
      const talia = getTalia();
      if (!text) { setStatus('status-notatki', 'Wklej tekst notatek.', 'err'); return; }

      const btn = document.querySelector('[onclick="wyslijNotatki()"]');
      btn.disabled = true;
      setStatus('status-notatki', 'Bielik analizuje... proszę czekać', '');

      try {
        const res    = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, talia }),
        });
        const result = await res.json();
        if (res.ok) {
          document.getElementById('notatkiInput').value = '';
          setStatus('status-notatki', `Wygenerowano ${result.count} fiszek!`, 'ok');
        } else {
          setStatus('status-notatki', result.error || 'Błąd serwera.', 'err');
        }
      } catch {
        setStatus('status-notatki', 'Błąd połączenia.', 'err');
      } finally {
        btn.disabled = false;
      }
    }

    loadDecks();
  </script>
</body>
</html>
